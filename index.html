<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --green:#0E7C6B; --green-dk:#095A4E; --green-lt:#DFF2EE; --green-sel:#14A38B;
  --paper:#FFFFFF; --canvas:#F7F8F7; --head:#EEF0EE; --grid:#E0E3E0; --line:#C9CEC9;
  --ink:#1F2A22; --muted:#5E6B62; --note:#FFF3B0; --note-line:#E8D36A; --danger:#B3261E;
  --ui:"Archivo", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", Consolas, "Courier New", monospace;
  --cw:96px; --rh:26px; --gut:44px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --green:#2BB39C; --green-dk:#1B7F6F; --green-lt:#183330; --green-sel:#3CCFB5;
    --paper:#1C211E; --canvas:#161A17; --head:#232924; --grid:#2A312C; --line:#3A433D;
    --ink:#E6ECE7; --muted:#9AA79E; --note:#4A4320; --note-line:#7A6C2A;
  }
}
:root[data-theme="dark"]{
  --green:#2BB39C; --green-dk:#1B7F6F; --green-lt:#183330; --green-sel:#3CCFB5;
  --paper:#1C211E; --canvas:#161A17; --head:#232924; --grid:#2A312C; --line:#3A433D;
  --ink:#E6ECE7; --muted:#9AA79E; --note:#4A4320; --note-line:#7A6C2A;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;font-family:var(--ui);color:var(--ink);background:var(--canvas);display:flex;flex-direction:column;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green-sel);outline-offset:2px}
a{color:var(--green)}

/* ---------- Title bar + ribbon ---------- */
.titlebar{background:var(--green);color:#fff;display:flex;align-items:center;gap:14px;padding:8px 16px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;font-weight:800;font-size:18px;letter-spacing:-.01em}
.logo-mark{width:30px;height:30px;display:block;flex:0 0 auto}
.titlebar .doc{opacity:.85;font-size:13px;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang{display:flex;border:1px solid rgba(255,255,255,.55);border-radius:3px;overflow:hidden;flex:0 0 auto}
.lang button{background:transparent;border:0;color:#fff;padding:3px 10px;font-size:12px;font-weight:700;cursor:pointer;opacity:.8}
.lang button:hover{opacity:1}
.lang button[aria-pressed="true"]{background:#fff;color:var(--green-dk);opacity:1}
@media (max-width:640px){.titlebar .doc{display:none}.lang{margin-left:auto}}
.ribbon{background:var(--green-dk);display:flex;gap:2px;padding:0 10px;overflow-x:auto}
.ribbon a{color:#fff;text-decoration:none;padding:9px 16px 8px;font-size:14px;font-weight:500;border-radius:6px 6px 0 0;white-space:nowrap;opacity:.85}
.ribbon a:hover{opacity:1;background:rgba(255,255,255,.08)}
.ribbon a[aria-current="page"]{background:var(--paper);color:var(--green);opacity:1;font-weight:700}

/* ---------- Formula bar ---------- */
.fbar{display:flex;align-items:stretch;background:var(--paper);border-bottom:1px solid var(--line);font-family:var(--mono);font-size:13px}
.namebox{width:110px;padding:6px 10px;border-right:1px solid var(--line);color:var(--ink)}
.fx{padding:6px 12px;border-right:1px solid var(--line);color:var(--muted);font-style:italic;font-family:Georgia,serif}
.formula{padding:6px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;color:var(--ink)}
.formula .fn{color:var(--green);font-weight:500}
.formula .str{color:#A8551B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .formula .str{color:#E9A06B}}

/* ---------- Sheet ---------- */
.sheet{flex:1;display:grid;grid-template-columns:var(--gut) 1fr;grid-template-rows:var(--rh) 1fr;overflow:hidden;background:var(--paper)}
.corner{background:var(--head);border-right:1px solid var(--line);border-bottom:1px solid var(--line);position:relative}
.corner::after{content:"";position:absolute;right:4px;bottom:4px;border:0 solid transparent;border-width:0 0 10px 10px;border-bottom-color:var(--line)}
.colhead,.rowhead{background:var(--head);color:var(--muted);font-size:12px;overflow:hidden;user-select:none}
.colhead{display:flex;border-bottom:1px solid var(--line)}
.colhead span{flex:0 0 var(--cw);text-align:center;line-height:var(--rh);border-right:1px solid var(--grid)}
.colhead span.on{background:var(--green-lt);color:var(--green);font-weight:700;box-shadow:inset 0 -2px 0 var(--green)}
.rowhead{border-right:1px solid var(--line)}
.rowhead span{display:block;height:var(--rh);line-height:var(--rh);text-align:center;border-bottom:1px solid var(--grid)}
.cells{overflow:auto;position:relative;background-color:var(--paper);
  background-image:linear-gradient(to right,var(--grid) 1px,transparent 1px),linear-gradient(to bottom,var(--grid) 1px,transparent 1px);
  background-size:var(--cw) var(--rh);background-position:-1px -1px}
.page{padding:calc(var(--rh)*2) calc(var(--cw)*.5) calc(var(--rh)*3);max-width:1100px}
.page[hidden]{display:none}

/* ---------- Selection block ---------- */
.block{background:var(--paper);border:1px solid var(--line);position:relative}
.block.sel{border:2px solid var(--green-sel)}
.block.sel::after{content:"";position:absolute;right:-5px;bottom:-5px;width:8px;height:8px;background:var(--green-sel);border:1.5px solid var(--paper)}
.block-h{background:var(--head);border-bottom:1px solid var(--line);padding:4px 12px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;font-family:var(--mono)}
.block-b{padding:18px 20px}

h1{font-size:clamp(30px,5vw,52px);line-height:1.05;letter-spacing:-.025em;font-weight:800;margin:0 0 16px}
h2{font-size:20px;margin:0 0 14px;letter-spacing:-.01em}
h3{font-size:18px;margin:6px 0 8px;letter-spacing:-.01em}
.lead{font-size:18px;color:var(--muted);max-width:62ch;margin:0}

/* Home */
.hero{margin-bottom:calc(var(--rh)*2)}
.hero .block-b{padding:36px 36px 40px}
.hero h1 .eq{color:var(--green);font-family:var(--mono);font-weight:500;margin-right:.1em}
.go{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:calc(var(--rh));}
.go a{display:flex;gap:16px;align-items:flex-start;text-decoration:none;color:var(--ink);padding:20px 22px;background:var(--paper);border:1px solid var(--line);position:relative;transition:border-color .15s}
.go a:hover{border:2px solid var(--green-sel);padding:19px 21px}
.go a:hover::after{content:"";position:absolute;right:-5px;bottom:-5px;width:8px;height:8px;background:var(--green-sel);border:1.5px solid var(--paper)}
.go .ico{font-size:28px;line-height:1}
.go strong{display:block;font-size:19px;margin-bottom:4px}
.go small{color:var(--muted);font-size:14px}

/* Forms */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],select,textarea{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:2px;padding:8px 10px;min-height:38px}
input[type=text]:focus,select:focus,textarea:focus{outline:none;border:2px solid var(--green-sel);padding:7px 9px}
textarea{min-height:96px;resize:vertical}
input[type=file]{font-size:14px;padding:8px;border:1px dashed var(--line);width:100%;background:var(--canvas)}
.btn{background:var(--green);color:#fff;border:0;border-radius:3px;padding:9px 18px;font-weight:600;cursor:pointer;min-height:38px}
.btn:hover{background:var(--green-dk)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--green);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--green);background:var(--green-lt)}

/* Brainstorm */
.bs-grid{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:calc(var(--rh)*1.5);align-items:start}
@media (max-width:860px){.bs-grid{grid-template-columns:1fr}}
.ideas{display:flex;flex-direction:column;gap:var(--rh)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.tag{display:inline-block;background:var(--green-lt);color:var(--green);font-size:12px;font-weight:600;padding:2px 8px;border-radius:2px}
.idea p{margin:0 0 14px;max-width:70ch}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vote{background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:5px 12px;cursor:pointer;font-size:14px}
.vote:hover{border-color:var(--green)}
.vote.on{background:var(--green-lt);border-color:var(--green);color:var(--green);font-weight:600}
.cmt-toggle{background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px;padding:5px 6px}
.comments{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.comment{background:var(--note);border-left:3px solid var(--note-line);padding:10px 12px;position:relative}
.comment::before{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 9px 9px 0;border-color:transparent var(--danger) transparent transparent}
.comment .who{font-size:13px;font-weight:600}
.comment .who time{font-weight:400;color:var(--muted);margin-left:8px}
.comment p{margin:4px 0 6px;font-size:14px}
.cmt-form{display:flex;gap:8px}
.cmt-form input{flex:1}

/* Templates */
.tpl-top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:var(--rh)}
.filters{display:grid;grid-template-columns:2fr repeat(5,1fr);gap:0;margin-bottom:var(--rh);border:1px solid var(--line);background:var(--paper)}
.filters > *{border:0;border-right:1px solid var(--line);border-radius:0}
.filters > *:last-child{border-right:0}
.filters input,.filters select{min-height:40px}
@media (max-width:1100px){.filters{grid-template-columns:1fr 1fr}.filters > *{border-bottom:1px solid var(--line)}.filters input{grid-column:1/-1}.filters > :last-child{grid-column:1/-1}}
.tpl-list{--tpl-lines:3;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:var(--rh)}
.tpl{display:flex;flex-direction:column;cursor:pointer;transition:border-color .15s}
.tpl:hover{border-color:var(--green-sel)}
/* A kép abszolút pozícióval tölti ki a teljes képterületet – telefonon sem marad üres sáv fölötte */
.tpl .thumb{position:relative;aspect-ratio:16/9;background-color:var(--canvas);display:flex;align-items:center;justify-content:center;text-align:center;padding:0 10px;border-bottom:1px solid var(--line);overflow:hidden;color:var(--muted);font-family:var(--mono);font-size:12px;
  background-image:linear-gradient(to right,var(--grid) 1px,transparent 1px),linear-gradient(to bottom,var(--grid) 1px,transparent 1px);background-size:32px 14px}
.tpl .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.tpl .block-b{padding:14px 16px;display:flex;flex-direction:column;flex:1}
.tpl h3{margin:6px 0 6px;font-size:17px;line-height:1.25;overflow-wrap:anywhere}
.tpl h3 a{color:inherit;text-decoration:none}
.tpl:hover h3 a,.tpl h3 a:focus-visible{color:var(--green)}
/* A leírásból csak pár sor látszik, a vége "…" (a sorok számát a --tpl-lines változó adja) */
.tpl p.tpl-desc{margin:0 0 14px;font-size:14px;line-height:1.45;color:var(--muted);display:-webkit-box;-webkit-line-clamp:var(--tpl-lines);-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis}
.tpl .actions{margin-top:auto;padding-top:12px;border-top:1px solid var(--grid)}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag.lg{display:inline-flex;align-items:center;gap:6px;background:var(--head);color:var(--ink)}
.flag{width:20px;height:14px;object-fit:cover;border:1px solid rgba(0,0,0,.2);border-radius:2px;flex:none;display:inline-block}
/* Nyelvválasztó (zászlókkal) */
.lp{position:relative}
.lp-btn{display:flex;align-items:center;gap:8px;width:100%;min-height:38px;padding:0 10px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:2px;font:inherit;cursor:pointer;text-align:left}
.lp-btn:focus-visible{outline:2px solid var(--green-sel);outline-offset:-1px}
.lp-cur{display:flex;align-items:center;gap:8px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lp-caret{color:var(--muted);font-size:12px}
.filters .lp-btn{border:0;border-radius:0;min-height:40px}
.lp-list{position:absolute;z-index:40;left:0;right:0;top:calc(100% + 2px);min-width:200px;max-height:260px;overflow:auto;margin:0;padding:4px 0;list-style:none;background:var(--paper);border:1px solid var(--green-sel);box-shadow:0 10px 30px rgba(0,0,0,.2)}
.lp-list[hidden]{display:none}
.lp-list li{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer}
.lp-list li:hover,.lp-list li:focus,.lp-list li[aria-selected=true]{background:var(--green-lt);outline:0}
.empty{text-align:center;padding:48px 20px}
/* Betöltés közbeni váz-csempék */
.skel{pointer-events:none}
.skel .thumb,.sk{background-image:linear-gradient(90deg,var(--head) 0,var(--grid) 50%,var(--head) 100%);background-size:200% 100%;animation:shim 1.3s linear infinite}
.sk{display:block;height:12px;border-radius:2px;margin:0 0 12px}.sk.tag{width:70px;height:18px}.sk.h{width:70%;height:18px}.sk.s{width:45%}
@keyframes shim{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel .thumb,.sk{animation:none}}
/* Sablon profiloldal */
.back{display:inline-flex;align-items:center;gap:6px;margin-bottom:var(--rh);color:var(--green);font-weight:600;text-decoration:none}
.back:hover{text-decoration:underline}
.tpl-detail-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:calc(var(--rh)*1.5);align-items:start}
@media (max-width:860px){.tpl-detail-grid{grid-template-columns:1fr}}
.tpl-detail-hero{aspect-ratio:16/10;background:var(--canvas);border:1px solid var(--line);overflow:hidden;display:flex;justify-content:center;align-items:center}
.tpl-detail-hero img{width:100%;height:100%;object-fit:contain;display:block}
.tpl-detail-hero .no-img{padding:60px 20px;font-family:var(--mono);color:var(--muted);text-align:center}
.tpl-aside .block-b{display:flex;flex-direction:column;gap:12px}
.tpl-title{margin:0;font-size:24px;line-height:1.2;overflow-wrap:anywhere}
.tpl-full{margin:0;color:var(--muted);line-height:1.5;white-space:pre-line;overflow-wrap:anywhere}
.tpl-aside .actions .btn{flex:1;text-align:center}
/* Használati útmutató */
.gd{margin-top:calc(var(--rh)*2);display:grid;gap:var(--rh)}
.gd-h{margin:0;font-size:22px}
.gd-note,.gd-none{color:var(--muted);margin:0}
.gd h4{margin:16px 0 6px;font-size:14px}
.gd ul{margin:0;padding-left:20px;display:grid;gap:4px}
.gd p{margin:0 0 8px;line-height:1.55}
.gd-feat{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.gd-f{padding:14px 16px;border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);display:flex;flex-direction:column;gap:4px}
.gd-f span{color:var(--muted);font-size:14px;line-height:1.5}
.gd details{border-bottom:1px solid var(--grid)}
.gd details:last-child{border-bottom:0}
.gd summary{cursor:pointer;padding:12px 4px;font-weight:600;list-style:none;display:flex;gap:10px;align-items:center}
.gd summary::-webkit-details-marker{display:none}
.gd summary::before{content:"▸";color:var(--green);transition:transform .15s}
.gd details[open] > summary::before{transform:rotate(90deg)}
.gd details > *:not(summary){margin-left:4px;margin-right:4px}
.gd details img{display:block;max-width:100%;height:auto;border:1px solid var(--line);margin:4px 4px 16px}
.gd-steps{list-style:none;padding:0;margin:0;display:grid;gap:10px;counter-reset:s}
.gd-steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;line-height:1.5}
.gd-steps li::before{content:counter(s);background:var(--green);color:#fff;font-family:var(--mono);font-size:13px;display:grid;place-items:center;height:26px}
.gd-steps strong{display:block}
.gd-steps span{color:var(--muted);font-size:14px}
.empty .big{font-family:var(--mono);font-size:34px;color:var(--danger);font-weight:500;margin-bottom:8px}
.empty p{color:var(--muted);margin:0}
.ad{margin-top:calc(var(--rh)*2);border:1px dashed var(--line);background:var(--canvas);color:var(--muted);text-align:center;padding:30px 12px;font-size:12px;letter-spacing:.04em}

/* Dialog */
dialog{border:0;padding:0;background:var(--paper);color:var(--ink);width:min(520px,calc(100% - 24px));box-shadow:0 18px 50px rgba(0,0,0,.28);border-radius:4px}
dialog::backdrop{background:rgba(6,38,33,.45)}
.dlg-h{background:var(--green);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center}
.dlg-h h2{margin:0;font-size:16px}
.dlg-x{background:none;border:0;color:#fff;font-size:22px;cursor:pointer;line-height:1;padding:0 4px}
.dlg-b{padding:20px}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;padding:0 20px 20px}
.err{color:var(--danger);font-size:13px;min-height:1.2em;margin:0}

/* Sheet tabs + status */
.tabs{display:flex;align-items:stretch;background:var(--head);border-top:1px solid var(--line);font-size:13px;overflow-x:auto}
.tabs .nav{padding:0 12px;color:var(--muted);display:flex;align-items:center;gap:10px}
.tabs a{padding:6px 18px;text-decoration:none;color:var(--ink);border-right:1px solid var(--line);white-space:nowrap}
.tabs a:hover{background:var(--paper)}
.tabs a[aria-current="page"]{background:var(--paper);color:var(--green);font-weight:700;box-shadow:inset 0 -3px 0 var(--green)}
.status{display:flex;gap:18px;align-items:center;justify-content:space-between;background:var(--green);color:#fff;font-size:12px;padding:3px 14px;flex-wrap:wrap}
.status .sum{display:flex;gap:18px}
.disclaimer{margin:0;padding:4px 14px 5px;font-size:11px;color:var(--muted);background:var(--head);border-top:1px solid var(--line)}

/* Drag-select & typing */
.drag-sel{position:absolute;left:0;top:0;width:0;height:0;border:2px solid var(--green-sel);background:color-mix(in srgb,var(--green-sel) 12%,transparent);pointer-events:none;z-index:4;opacity:0}
.drag-sel::after{content:"";position:absolute;right:-5px;bottom:-5px;width:8px;height:8px;background:var(--green-sel);border:1.5px solid var(--paper)}
.xcursor{position:absolute;left:0;top:0;width:26px;height:26px;margin:-13px 0 0 -13px;pointer-events:none;z-index:5;opacity:0}
.xcursor svg{width:100%;height:100%;transition:transform .1s;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.xcursor.down svg{transform:scale(.84)}
#page-home .hero .lead,#page-home .go{transition:opacity .55s ease-out,transform .55s ease-out}
#page-home .go{transition-delay:.18s}
#page-home.intro .hero{visibility:hidden}
#page-home.intro.typing .hero{visibility:visible;animation:heroIn .2s ease-out}

@keyframes heroIn{from{background:color-mix(in srgb,var(--green-sel) 12%,var(--paper))}}
.toast{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:3px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99}
.toast.show{opacity:1}

  :root{--cw:72px;--gut:32px}
  .page{padding:var(--rh) 14px calc(var(--rh)*2)}
  .hero .block-b{padding:24px 20px}
  .namebox{width:64px}
  .tpl-title{font-size:21px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function ago(ts){
  const m = Math.round((Date.now()-ts)/60000);
  if (m < 1) return t('ago.now');
  if (m < 60) return t('ago.m', m);
  const h = Math.round(m/60); if (h < 24) return t('ago.h', h);
  return t('ago.d', Math.round(h/24));

  if (v){ const it = ideas.find(x=>x.id===v.dataset.vote); voted[it.id] = !voted[it.id]; it.votes += voted[it.id]?1:-1; }
  else if (cv){ const [iid,cid]=cv.dataset.cvote.split(':'); const c = ideas.find(x=>x.id===iid).comments.find(x=>x.id===cid); voted[cid]=!voted[cid]; c.votes += voted[cid]?1:-1; }

  saveIdeas(); renderIdeas(); updateSum('brainstorming');
});

function langPicker(el, opts){

  let items = [];
  const label = v => v === '' ? esc(t(opts.all || 'f.lang.all')) : `${flagImg(v)}<span>${esc(langName(v))}</span>`;
  const draw = () => {
    cur.innerHTML = label(el.dataset.value);
    ul.innerHTML = items.map(v => `<li role="option" tabindex="-1" data-v="${esc(v)}" aria-selected="${v === el.dataset.value}">${label(v)}</li>`).join('');

  const set = v => { if (el.dataset.value !== v){ el.dataset.value = v; draw(); el.dispatchEvent(new Event('input', {bubbles:true})); } open(false); };
  btn.addEventListener('click', () => open(ul.hidden));
  ul.addEventListener('click', e => { const li = e.target.closest('li'); if (li){ set(li.dataset.v); btn.focus(); } });
  el.addEventListener('keydown', e => {
    const lis = [...ul.children], i = lis.indexOf(document.activeElement);
    if (e.key === 'Escape' && !ul.hidden){ e.preventDefault(); open(false); btn.focus(); }
    else if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault(); if (ul.hidden) open(true);
      const n = e.key === 'ArrowDown' ? Math.min(i + 1, lis.length - 1) : Math.max(i - 1, 0);
      if (lis[n]) lis[n].focus();
    } else if ((e.key === 'Enter' || e.key === ' ') && document.activeElement.tagName === 'LI'){ e.preventDefault(); set(document.activeElement.dataset.v); btn.focus(); }
  });
  document.addEventListener('click', e => { if (!el.contains(e.target)) open(false); });
  el.setItems = arr => { items = arr; if (!arr.includes(el.dataset.value)) el.dataset.value = arr.includes('') ? '' : (arr[0] || ''); draw(); };
  el.setValue = v => { el.dataset.value = v; draw(); };
  el.refresh = draw;
  return el;
}

// A Drive-képeket a gyorsabb, gyorsítótárazott googleusercontent szerverről kérjük (hiba esetén visszaesik az eredeti linkre).
function fastImg(u, w){
  if (!u || /^data:|^blob:/.test(u)) return u;
  if (!/drive\.google\.com|googleusercontent\.com/.test(u)) return u;
  const m = u.match(/[?&]id=([\w-]+)/) || u.match(/\/d\/([\w-]+)/);
  return m ? `https://lh3.googleusercontent.com/d/${m[1]}=w${w}` : u;
}
document.addEventListener('error', e => {
  const i = e.target;
  if (i && i.tagName === 'IMG' && i.dataset.orig && i.getAttribute('src') !== i.dataset.orig){ i.src = i.dataset.orig; }
}, true);

// Sablonok élő betöltése Google Drive-ból (gyorsítótárral, párhuzamos kérések nélkül)
function loadTplsFromDrive(force){
  if (!SCRIPT_URL){
    tpls = store.get('tpls', []); tplsLoaded = true;
    renderCats(); renderTpls(); renderTplView();
    return Promise.resolve();
  }
  if (tplInflight) return tplInflight;
  if (!force && tplsLoaded && tplFetchedAt && Date.now() - tplFetchedAt < 45000) return Promise.resolve();
  tplsLoading = true;
  if (!tpls.length){ renderTpls(); renderTplView(); }       // váz-csempék, amíg nincs adat
  const req = window.__EZX_TPL || fetch(SCRIPT_URL).then(r => r.json());
  window.__EZX_TPL = null;
  tplInflight = (async () => {
    let changed = false;
    const wasEmpty = !tpls.length;
    try {
      const data = await req;
      if (Array.isArray(data)){
        changed = JSON.stringify(data) !== JSON.stringify(tpls);
        tpls = data;
        store.set('tplcache', data);
      }
    } catch(e){
      console.error("Hiba a Drive sablonok betöltésekor:", e);
      if (!tpls.length) tpls = store.get('tpls', []);
    }
    tplsLoaded = true; tplsLoading = false; tplFetchedAt = Date.now(); tplInflight = null;
    if (changed || wasEmpty){ renderCats(); renderTpls(); renderTplView(); }
  })();
  return tplInflight;
}

const nrm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
let guideIdx = null; const guideCache = {};
async function findGuideId(x){
  if (x.guide) return String(x.guide);
  if (!guideIdx){ try { guideIdx = await (await fetch('guides/index.json')).json(); } catch(e){ guideIdx = []; } }
  const n = nrm(x.name);
  for (const g of guideIdx){ if (n === g.keys[0] || n.includes(g.keys[0]) || g.keys.slice(1).includes(n)) return g.id; }
  return null;
}
async function loadGuide(x){

  if (guideCache[id]) return guideCache[id];

}

const dlg = $('#upload');
$('#open-upload').addEventListener('click', ()=>{ $('#u-err').textContent=''; uLang.setValue(defaultUpLang()); dlg.showModal(); });
const readAs = f => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(f); });
// Az indexképet feltöltés előtt kisebbre (max. 1000 px, JPEG) tömörítjük: telefonos fotónál több MB helyett pár 100 KB megy fel.
async function shrinkImage(f, maxW=1000, q=0.82){
  if (f.size < 180e3 && /jpe?g|webp/.test(f.type)) return readAs(f);
  try {
    const bmp = await createImageBitmap(f);
    const k = Math.min(1, maxW / bmp.width);
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(bmp,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg', q);
  } catch(err){ return readAs(f); }
}

$('#upload-form').addEventListener('submit', async e=>{
  if (e.submitter && e.submitter.value==='cancel') return;
  e.preventDefault();
  const name=$('#u-name').value.trim(), file=$('#u-file').files[0], imgF=$('#u-img').files[0];
  if(!name){ $('#u-err').textContent=t('err.name'); return; }
  if(!file || !/\.xlsx?$/i.test(file.name)){ $('#u-err').textContent=t('err.file'); return; }
  if(file.size > 3e6){ $('#u-err').textContent=t('err.size'); return; }

  const saveBtn = $('#u-save');
  saveBtn.disabled = true;
  const origText = saveBtn.textContent;
  saveBtn.textContent = t('u.prep');

  try {
    const [fileBase64, imgBase64] = await Promise.all([readAs(file), imgF ? shrinkImage(imgF) : '']);
    saveBtn.textContent = t('u.sending');
    const category = $('#u-newcat').value.trim() || $('#u-cat').value;
    const description = $('#u-desc').value.trim();
    const language = uLang.dataset.value || defaultUpLang();

    if (SCRIPT_URL) {
      const payload = {
        name: name,
        cat: category,
        lang: language,
        desc: description,
        fileName: file.name,
        fileData: fileBase64,
        imgData: imgBase64
      };

      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      });
      const result = await res.json();
      if (result.status === 'error') {
        throw new Error(result.message);
      }
      loadTplsFromDrive(true);   // a lista a háttérben frissül – a párbeszédablak azonnal bezárul
    } else {
      const x = { id:'t'+Date.now(), name, cat: category, lang: language, desc: description,
        file: fileBase64, fileName:file.name, img: imgBase64, t:Date.now(), dl:0 };
      tpls.unshift(x);
      saveTpls();
      renderCats();
      renderTpls();
    }

    e.target.reset();
    uLang.setValue(defaultUpLang());
    dlg.close();
    toast(t('toast.tpl'));
  } catch(err) {
    $('#u-err').textContent = 'Hiba a feltöltés során: ' + err.message;
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = origText;
  }
});

/* Intro animation */
const intro = {done:false, running:false, cancel:null};
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const colName = i => cols[i] || ('C'+(i+1));
const cssPx = v => parseFloat(getComputedStyle(document.documentElement).getPropertyValue(v));
function highlightCols(a,b){ document.querySelectorAll('#colhead span').forEach((s,i)=>s.classList.toggle('on', i>=a && i<=b)); }
function heroGeom(){
  const hero=$('.hero'), cr=cells.getBoundingClientRect(), r=hero.getBoundingClientRect(), cw=cssPx('--cw'), rh=cssPx('--rh');
  const x=r.left-cr.left+cells.scrollLeft, y=r.top-cr.top+cells.scrollTop;
  return {x,y,w:r.width,h:r.height,cw,rh,c0:Math.floor(x/cw),r0:Math.floor(y/rh),c1:Math.floor((x+r.width-1)/cw),r1:Math.floor((y+r.height-1)/rh)};
}
const rangeLabel = g => colName(g.c0)+(g.r0+1)+':'+colName(g.c1)+(g.r1+1);
const CURSOR = '<svg viewBox="0 0 26 26"><path d="M9 1h8v8h8v8h-8v8H9v-8H1V9h8z" fill="#fff" stroke="#1F2A22" stroke-width="1.6" stroke-linejoin="round"/></svg>';

async function playIntro(){
  if (intro.done || intro.running || current!=='home') return;
  intro.running = true;
  try{ await Promise.race([document.fonts ? document.fonts.ready : null, sleep(1200)]); }catch(e){}
  if (current!=='home'){ intro.running=false; return; }
  const page=$('#page-home'), hero=$('.hero'), h1=$('#page-home h1 [data-i18n]');
  const g = heroGeom(); $('#hero-range').textContent = rangeLabel(g);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches){ intro.running=false; intro.done=true; return; }

  let stop=false;
  const sel=document.createElement('div'); sel.className='drag-sel';
  const cur=document.createElement('div'); cur.className='xcursor'; cur.innerHTML=CURSOR;
  cells.append(sel,cur);
  page.classList.add('intro');
  hero.style.minHeight = g.h+'px';

  const finish = () => {
    if (stop) return; stop=true;
    sel.remove(); cur.remove(); hero.style.minHeight='';
    page.classList.remove('intro','typing');
    h1.textContent = t('home.h1');
    if (current==='home'){ $('#formula').innerHTML = t('fx.home'); $('#namebox').textContent='A1'; highlightCols(0,0); }
    document.removeEventListener('pointerdown', finish, true);
    document.removeEventListener('keydown', finish, true);
    intro.running=false; intro.done=true; intro.cancel=null;
  };
  intro.cancel = finish;
  document.addEventListener('pointerdown', finish, true);
  document.addEventListener('keydown', finish, true);

  const {x,y,w,h,cw,rh} = g, sx=g.c0*cw, sy=g.r0*rh;
  const place = (el,px,py) => el.style.transform = `translate(${px}px,${py}px)`;
  const ox=sx+cw*.45, oy=sy+rh*.5, ex=x+w-cw*.45, ey=y+h-rh*.5;

  place(cur, ox+cw*1.8, oy-rh*1.6);
  await sleep(300); if(stop) return;
  cur.style.transition='transform .5s cubic-bezier(.25,.8,.35,1), opacity .25s';
  cur.style.opacity=1; place(cur, ox, oy);
  await sleep(560); if(stop) return;

  cur.classList.add('down'); cur.style.transition='opacity .25s';
  Object.assign(sel.style,{left:sx+'px',top:sy+'px',width:cw+'px',height:rh+'px',opacity:1});
  $('#namebox').textContent = colName(g.c0)+(g.r0+1); highlightCols(g.c0,g.c0);
  await sleep(140); if(stop) return;

  const D=1150, t0=performance.now();
  await new Promise(res=>{
    const frame = now => {
      if (stop) return res();
      const p=Math.min(1,(now-t0)/D), e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
      const px=ox+(ex-ox)*e, py=oy+(ey-oy)*e; place(cur,px,py);
      const c1=Math.max(g.c0,Math.floor(px/cw)), r1=Math.max(g.r0,Math.floor(py/rh));
      sel.style.width=(c1-g.c0+1)*cw+'px'; sel.style.height=(r1-g.r0+1)*rh+'px';
      const R=r1-g.r0+1, C=c1-g.c0+1;
      $('#namebox').textContent = lang==='hu' ? `${R}S × ${C}O` : `${R}R × ${C}C`;
      highlightCols(g.c0,c1);
      p<1 ? requestAnimationFrame(frame) : res();
    };
    requestAnimationFrame(frame);
  });
  if(stop) return;

  cur.classList.remove('down'); cur.style.opacity=0;
  $('#namebox').textContent = rangeLabel(g);
  sel.style.transition='left .22s ease-out, top .22s ease-out, width .22s ease-out, height .22s ease-out';
  Object.assign(sel.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});
  await sleep(260); if(stop) return;
  sel.remove();

  const full=t('home.h1');
  h1.textContent=''; $('#formula').textContent=''; page.classList.add('typing');
  await sleep(220);
  for (let i=1;i<=full.length;i++){
    if(stop) return;
    h1.textContent=full.slice(0,i); $('#formula').textContent=full.slice(0,i);
    await sleep(full[i-1]===' ' ? 55 : 24+Math.random()*26);
  }
  await sleep(450); if(stop) return;

  finish();
}

applyLang();
loadTplsFromDrive();
loadIdeasFromDrive();
})();
</script>
